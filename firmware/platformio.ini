; Quad board -- Seeed reTerminal E1001 (7.5" 800x480 mono UC8179, ESP32-S3,
; 32MB flash / 8MB OPI PSRAM, 2000mAh). Board setup copied from
; an earlier E1001 project.

[env:quad]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200

board_upload.flash_size = 32MB
board_build.partitions = default_8MB.csv
board_build.arduino.memory_type = qio_opi

build_flags =
    -DBOARD_SCREEN_COMBO=520
    -DBOARD_HAS_PSRAM
    -UARDUINO_USB_CDC_ON_BOOT
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DCORE_DEBUG_LEVEL=2

lib_deps =
    https://github.com/Seeed-Studio/Seeed_GFX.git
