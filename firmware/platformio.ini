; Quad board -- Seeed reTerminal E1001 (7.5" 800x480 mono UC8179, ESP32-S3,
; 32MB flash / 8MB OPI PSRAM, 2000mAh). Board setup copied from
; an earlier E1001 project.

[env:quad]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200

board_upload.flash_size = 32MB
board_build.partitions = default_8MB.csv
board_build.arduino.memory_type = qio_opi

build_flags =
    -DBOARD_SCREEN_COMBO=520
    -DBOARD_HAS_PSRAM
    -UARDUINO_USB_CDC_ON_BOOT
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DCORE_DEBUG_LEVEL=2

lib_deps =
    https://github.com/Seeed-Studio/Seeed_GFX.git

; Quad board -- Seeed reTerminal E1003 (10.3" 1872x1404 ED103TC2 behind an
; IT8951-class TCON, 16 grey levels, GT911 touch, ESP32-S3 32MB / 8MB PSRAM).
; Same app, model picked by -DQUAD_E1003 (see src/board.h). Seeed_GFX setup 522.
[env:quad-e1003]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200

board_upload.flash_size = 32MB
board_build.partitions = default_8MB.csv
board_build.arduino.memory_type = qio_opi

build_flags =
    -DBOARD_SCREEN_COMBO=522
    -DQUAD_E1003
    -DBOARD_HAS_PSRAM
    -UARDUINO_USB_CDC_ON_BOOT
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DCORE_DEBUG_LEVEL=2

lib_deps =
    https://github.com/Seeed-Studio/Seeed_GFX.git
