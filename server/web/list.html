<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Quad List">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="list.webmanifest">
<title>Quad List</title>
<style>
  :root { --ink:#111; --line:#ddd; --mute:#888; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; background:#fff; color:var(--ink);
    font:17px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  main { max-width:560px; margin:0 auto;
    padding: calc(12px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right))
             calc(24px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left)); }
  body.embed main { padding:8px; }
  h1 { font-size:24px; margin:4px 0 12px; display:flex; justify-content:space-between; align-items:baseline; }
  h1 small { font-size:15px; color:var(--mute); font-weight:500; }
  form { display:flex; gap:8px; position:sticky; top:0; background:#fff; padding:6px 0 10px; z-index:2; }
  textarea { flex:1; font-size:17px; /* >=16px: iOS won't zoom */ padding:10px 12px; border:1.5px solid var(--ink);
    border-radius:12px; resize:none; min-height:46px; max-height:140px; font-family:inherit; }
  button { font-size:17px; border:0; border-radius:12px; background:var(--ink); color:#fff; padding:0 16px; min-height:46px; font-weight:600; }
  button.ghost { background:#f1f1f1; color:var(--ink); }
  ul { list-style:none; margin:0; padding:0; }
  li { display:flex; align-items:center; gap:12px; border-bottom:1px solid var(--line); min-height:54px; }
  li label { flex:1; display:flex; align-items:center; gap:12px; padding:10px 0; font-size:19px; }
  li input[type=checkbox] { width:26px; height:26px; accent-color:var(--ink); flex:none; }
  li.done label span { color:var(--mute); text-decoration:line-through; }
  li .x { background:none; color:var(--mute); font-size:24px; padding:0 6px; min-height:44px; }
  .bar { display:flex; justify-content:space-between; align-items:center; margin-top:14px; gap:8px; }
  .note { color:var(--mute); font-size:14px; }
  .empty { color:var(--mute); padding:24px 0; text-align:center; }
</style>
</head>
<body>
<main>
  <h1>Shopping list <small id="count"></small></h1>
  <form id="add" autocomplete="off">
    <textarea id="item" rows="1" placeholder="Add items: milk, eggs, challah" enterkeyhint="done" autocapitalize="sentences" autofocus></textarea>
    <button type="submit">Add</button>
  </form>
  <ul id="list"></ul>
  <div class="bar">
    <span class="note">Commas or new lines add several at once.</span>
    <button class="ghost" id="clear" type="button">Clear checked</button>
  </div>
  <div class="bar"><span></span><a class="note" href="logout">Sign out</a>
  </div>
</main>
<script>
const qs = new URLSearchParams(location.search);
const K = qs.get('k') || '';   // normally empty: the server turned ?k= into a list-only session cookie
if (qs.get('embed')) document.body.classList.add('embed');
const base = location.pathname.replace(/\/list(\.html)?\/?$/, '');
const api = (p) => K ? `${base}${p}?k=${encodeURIComponent(K)}` : `${base}${p}`;
const $ = (id) => document.getElementById(id);
let items = [];

function draw() {
  const ul = $('list'); ul.innerHTML = '';
  const todo = items.filter(i => !i.done), done = items.filter(i => i.done);
  $('count').textContent = items.length ? `${todo.length} to get${done.length ? ` · ${done.length} done` : ''}` : '';
  if (!items.length) { ul.innerHTML = '<li class="empty">Nothing on the list</li>'; return; }
  for (const it of [...todo, ...done]) {
    const li = document.createElement('li'); if (it.done) li.className = 'done';
    const lab = document.createElement('label');
    const cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = !!it.done;
    cb.onchange = () => send({op: 'toggle', id: it.id});
    const sp = document.createElement('span'); sp.textContent = it.text;
    lab.append(cb, sp);
    const x = document.createElement('button'); x.className = 'x'; x.type = 'button'; x.textContent = '×';
    x.setAttribute('aria-label', 'Remove ' + it.text); x.onclick = () => send({op: 'remove', id: it.id});
    li.append(lab, x); ul.appendChild(li);
  }
}
async function load() {
  const r = await fetch(api('/api/list')); if (!r.ok) { $('list').innerHTML = '<li class="empty">Not authorized (check the link)</li>'; return; }
  items = (await r.json()).items || []; draw();
}
async function send(body) {
  const r = await fetch(api('/api/list'), {method: 'POST', body: JSON.stringify(body)});
  const j = await r.json(); if (j.items) { items = j.items; draw(); }
}
$('add').onsubmit = (e) => {
  e.preventDefault();
  const v = $('item').value.trim(); if (!v) return;
  $('item').value = ''; send({op: 'add', text: v}); $('item').focus();
};
$('item').addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('add').requestSubmit(); } });
$('clear').onclick = () => send({op: 'clear_checked'});
document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
load(); setInterval(() => { if (!document.hidden) load(); }, 15000);
</script>
</body>
</html>
